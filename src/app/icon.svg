<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- NewWeekend monogram: one unbroken line that spells N then W.
       Like the wordmark, the colour breaks from neutral to amber exactly
       where "New" becomes "Weekend". -->
  <rect width="32" height="32" rx="7" fill="#0f172a"/>
  <g fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 22V10l7 12V10" stroke="#f8fafc"/>
    <path d="M12 10l3.6 12 3.9-9 3.9 9L27 10" stroke="#f59e0b"/>
  </g>
</svg>
